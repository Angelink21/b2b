<html lang="uk" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fagor Industrial — Лінійка</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root{--bg:#F3F5F7;--floor:#E3E7EB;--line:#C5CCD4;--ink:#0F1B2D;--steel:#556171;--red:#C9331C;--red-h:#B02A16;--on-red:#fff;--surf:#fff;
--serif:Spectral,Georgia,'Times New Roman',serif;--sans:'Source Sans 3',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
--s1:4px;--s2:8px;--s3:16px;--s4:24px;--s5:48px;--s6:96px;--r:6px}
[data-theme=dark]{--bg:#0E141C;--floor:#17202B;--line:#2B3745;--ink:#E9EEF3;--steel:#9AA7B5;--surf:#131B25}
*{box-sizing:border-box}html{scroll-padding-top:72px}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.55 var(--sans);font-variant-numeric:tabular-nums}
a{color:inherit}h1,h2,h3{font-family:var(--serif);font-weight:300;line-height:1.12;margin:0;letter-spacing:-.01em}
h1{font-size:clamp(34px,5.4vw,64px)}h2{font-size:clamp(26px,3.4vw,40px)}h3{font-size:22px;font-weight:400}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.wrap{max-width:1200px;margin:0 auto;padding:0 var(--s4)}
.skip{position:absolute;left:-999px}.skip:focus{left:8px;top:8px;background:var(--surf);padding:8px;z-index:9}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
header .wrap{display:flex;align-items:center;gap:var(--s3);height:64px}
.brand{font:400 22px var(--serif);text-decoration:none;margin-right:auto}
nav{display:flex;gap:var(--s4)}nav a{text-decoration:none;color:var(--steel)}nav a:hover{color:var(--ink)}
.btn{font:500 16px var(--sans);display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 var(--s4);border-radius:var(--r);border:1.5px solid var(--ink);background:none;color:var(--ink);cursor:pointer;text-decoration:none;transition:background .15s}
.btn:hover{background:var(--floor)}
.btn.red{background:var(--red);border-color:var(--red);color:var(--on-red)}.btn.red:hover{background:var(--red-h);border-color:var(--red-h)}
.btn.sm{min-height:36px;padding:0 var(--s3);font-size:15px}
.hero{padding:var(--s5) 0 0}.hero p{color:var(--steel);max-width:52ch;margin:var(--s3) 0 0}
.stage{margin-top:var(--s4);background:var(--floor);border-top:1px solid var(--line);overflow-x:auto}
.stage-in{min-width:760px;max-width:1200px;margin:0 auto;padding:0 var(--s4)}
.line{display:flex;justify-content:space-between;align-items:flex-end;height:230px;border-bottom:1.5px solid var(--ink)}
.mc{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;opacity:.32;transition:opacity .25s}
.mc.on{opacity:1}.mc svg{display:block}
.kgs{display:flex;justify-content:space-between;font-size:14px;color:var(--steel);padding-top:6px}
.kgs span{width:0;display:flex;justify-content:center;white-space:nowrap}.kgs span.on{color:var(--ink);font-weight:600}
.ruler{position:relative;height:44px;margin:6px 0 0}
.band{position:absolute;top:19px;height:6px;border-radius:3px;background:var(--ink)}
.ruler input{position:absolute;left:-11px;width:calc(100% + 22px);top:0;height:44px;margin:0;background:none;pointer-events:none;-webkit-appearance:none;appearance:none}
.ruler input::-webkit-slider-thumb{-webkit-appearance:none;pointer-events:auto;width:22px;height:22px;border-radius:50%;background:var(--surf);border:2.5px solid var(--ink);cursor:grab}
.ruler input::-moz-range-thumb{pointer-events:auto;width:18px;height:18px;border-radius:50%;background:var(--surf);border:2.5px solid var(--ink);cursor:grab}
.ruler input::-webkit-slider-runnable-track{background:none}.ruler input::-moz-range-track{background:none}
.ruler:before{content:"";position:absolute;left:0;right:0;top:21px;height:2px;background:var(--line)}
.read{display:flex;flex-wrap:wrap;align-items:center;gap:var(--s3) var(--s4);padding:var(--s3) 0 var(--s4)}
.read output{font:400 26px var(--serif);margin-right:auto}.read small{font:400 17px var(--sans);color:var(--steel)}
section.blk{padding:var(--s6) 0 0}.blk h2{margin-bottom:var(--s4)}
.rows{border-top:1px solid var(--line)}
.row{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr) auto;gap:var(--s3) var(--s4);align-items:baseline;padding:var(--s3) 0;border-bottom:1px solid var(--line);text-decoration:none}
.row:hover b{text-decoration:underline}.row b{font:400 22px var(--serif)}.row span{color:var(--steel)}.row i{font-style:normal;color:var(--steel)}
.tools{display:flex;flex-wrap:wrap;gap:var(--s2);align-items:center;margin:var(--s4) 0 var(--s3)}
.chip{font:500 15px var(--sans);min-height:40px;padding:0 var(--s3);border-radius:20px;border:1.5px solid var(--line);background:none;color:var(--ink);cursor:pointer}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
input[type=search],select,.f input,.f select,.f textarea{font:400 17px var(--sans);min-height:44px;padding:0 12px;border-radius:var(--r);border:1.5px solid var(--steel);background:var(--surf);color:var(--ink);width:100%}
.tools input,.tools select{width:auto}.f textarea{padding:10px 12px;min-height:96px}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:720px}
th,td{text-align:left;padding:12px 12px 12px 0;border-bottom:1px solid var(--line);vertical-align:baseline}
th button{font:600 15px var(--sans);color:var(--steel);background:none;border:0;cursor:pointer;padding:0}th[aria-sort] button{color:var(--ink)}
td a{font-weight:600}td:nth-child(n+3){white-space:nowrap}
.mhead{display:grid;grid-template-columns:minmax(0,6fr) minmax(0,5fr);gap:var(--s5);padding-top:var(--s5)}
.draw{background:var(--floor);padding:var(--s4);display:flex;align-items:center;justify-content:center;min-height:360px}.draw img{max-width:100%;max-height:340px}
dl{margin:var(--s4) 0;display:grid;grid-template-columns:auto 1fr;border-top:1px solid var(--line)}
dt,dd{margin:0;padding:10px 0;border-bottom:1px solid var(--line)}dt{color:var(--steel);padding-right:var(--s4)}dd{text-align:right;font-weight:600}
.crumbs{color:var(--steel);margin-top:var(--s4)}
#quote{margin-top:var(--s6);background:var(--floor);padding:var(--s5) 0}
.qg{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:var(--s5)}
.f{display:grid;grid-template-columns:1fr 1fr;gap:var(--s3)}.f label{display:block;font-weight:600;margin-bottom:4px}.f .w{grid-column:1/-1}
.err{display:none;margin-top:4px;font-size:15px;font-weight:600;border-left:3px solid var(--ink);padding-left:8px}.bad .err{display:block}.bad input,.bad select{border-color:var(--ink);border-width:3px}
.ok{padding:var(--s4);background:var(--surf);border-left:4px solid var(--ink)}
footer{padding:var(--s4) 0;color:var(--steel);font-size:15px}
.hide{display:none!important}
@media(max-width:820px){nav{display:none}.row,.mhead,.qg{grid-template-columns:1fr}.f{grid-template-columns:1fr}.line{height:200px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

const full=()=>st.lo==0&&st.hi==1000;
const match=m=>full()||inR(m);
function drawM(m,s,small){const w=m.w*s,h=m.z*s,r=Math.min(w,h)*.27;return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true"><rect x=".75" y=".75" width="${w-1.5}" height="${h-1.5}" fill="var(--surf)" stroke="var(--ink)" stroke-width="1.5"/><rect x="6" y="6" width="${w-12}" height="${Math.max(5,h*.05)}" fill="var(--ink)"/><circle cx="${w/2}" cy="${h*.57}" r="${r}" fill="none" stroke="var(--ink)" stroke-width="1.5"/><circle cx="${w/2}" cy="${h*.57}" r="${r*.72}" fill="none" stroke="var(--line)" stroke-width="1.5"/></svg>`}
function buildLine(){const s=190/Math.max(...LU.map(m=>m.z));$("#line").innerHTML=LU.map(m=>`<div class="mc">${drawM(m,s)}</div>`).join("");$("#kgs").innerHTML=LU.map(m=>`<span>${m.kmax}</span>`).join("")}
function setRange(){const a=Math.min(st.lo,st.hi),b=Math.max(st.lo,st.hi);st.lo=a;st.hi=b;$("#band").style.left=a/10+"%";$("#band").style.width=(b-a)/10+"%";
$$(".mc").forEach((e,i)=>e.classList.toggle("on",full()||(LU[i].kmax>=kgOf(a)-.01&&LU[i].kmax<=kgOf(b)+.01)));$$("#kgs span").forEach((e,i)=>e.classList.toggle("on",$$(".mc")[i].classList.contains("on")&&!full()));
const n=D.filter(match).length,lo=Math.round(kgOf(a)),hi=Math.round(kgOf(b));
$("#out").innerHTML=`${full()?"":lo+"–"+hi+" "+tx("kg")+" "}<small>${tx("mod")}: ${n}</small>`;$("#toQ").textContent=tx("quote")+" · "+n;$("#fk").value=full()?"":hi;if(cur=="catalog")table()}
function tween(){const t0=performance.now(),A=[330,650],rm=matchMedia("(prefers-reduced-motion:reduce)").matches;if(rm){st.lo=A[0];st.hi=A[1];$("#r1").value=A[0];$("#r2").value=A[1];return setRange()}
(function f(t){const p=Math.min(1,(t-t0)/1100),e=1-Math.pow(1-p,3);st.lo=Math.round(A[0]*e);st.hi=Math.round(A[1]*e);$("#r1").value=st.lo;$("#r2").value=st.hi;setRange();if(p<1)requestAnimationFrame(f)})(t0)}
function inds(){$("#inds").innerHTML=Object.entries(L[lang].indt).map(([b,[n,d]])=>`<a class="row" href="#catalog" data-b="${b}"><b>${n}</b><span>${d}</span><i>${tx("mod")}: ${D.filter(m=>m.a&b).length}</i></a>`).join("");
const pk=[[0,25],[1,25],[2,0],[4,0]].map(([t,k])=>{const c=D.filter(m=>m.t==t);return c.sort((x,y)=>Math.abs((x.kmax||0)-k)-Math.abs((y.kmax||0)-k))[0]}).filter(Boolean);
$("#tops").innerHTML=pk.map(m=>`<a class="row" href="#m${D.indexOf(m)}"><b>${m.n}</b><span>${tn(m.t)}${m.h>=0?" · "+hn(m.h):""}</span><i>${kgT(m)}</i></a>`).join("")}
function head(){const C=[["n","n"],["t","t"],["kmax","l"],["pk","p"],["h","h"],["w","d"]];$("#thead").innerHTML=C.map(([k,l])=>`<th scope="col" ${st.sk==k?`aria-sort="${st.sd>0?"ascending":"descending"}"`:""}><button data-k="${k}">${tx(l)}</button></th>`).join("")}
function table(){const q=st.q.toLowerCase();let r=D.map((m,i)=>[m,i]).filter(([m])=>(st.t<0||m.t==st.t)&&(st.h<0||m.h==st.h)&&m.n.toLowerCase().includes(q)&&match(m));
r.sort(([a],[b])=>{const x=st.sk=="pk"?parseFloat(a.p)||0:a[st.sk]??"",y=st.sk=="pk"?parseFloat(b.p)||0:b[st.sk]??"";return(x>y?1:x<y?-1:0)*st.sd});
$("#cnt").textContent=tx("mod")+": "+r.length;$("#tb").innerHTML=r.slice(0,st.lim).map(([m,i])=>`<tr><td><a href="#m${i}">${m.n}</a></td><td>${tn(m.t)}</td><td>${kgT(m)}</td><td>${m.p?m.p+" "+(lang=="uk"?"кВт":"kW"):"—"}</td><td>${hn(m.h)||"—"}</td><td>${m.w?m.w+"×"+m.d+"×"+m.z:"—"}</td></tr>`).join("");$("#more").classList.toggle("hide",r.length<=st.lim);head()}
function chips(){$("#types").innerHTML=[-1,...T.map((_,i)=>i)].filter(i=>i<0||D.some(m=>m.t==i)).map(i=>`<button class="chip" data-t="${i}" aria-pressed="${st.t==i}">${i<0?tx("all"):tn(i)}</button>`).join("");$("#heat").innerHTML=`<option value="-1">${tx("allh")}</option>`+H.map((h,i)=>`<option value="${i}" ${st.h==i?"selected":""}>${hn(i)}</option>`).join("")}
function model(i){const m=D[i];$("#mn").textContent=m.n;$("#ms").textContent=m.sh||tn(m.t);let s=`<dt>${tx("t")}</dt><dd>${tn(m.t)}</dd>`;if(m.kr)s+=`<dt>${tx("spec").kg}</dt><dd>${m.kr}</dd>`;
["l","p","bp","g","s","sd","rw","sp","v","ex","af","nz"].forEach(k=>{if(m[k]!=null)s+=`<dt>${tx("spec")[k]}</dt><dd>${m[k]}</dd>`});if(m.h>=0)s+=`<dt>${tx("hd")}</dt><dd>${hn(m.h)}</dd>`;if(m.w)s+=`<dt>${tx("dm")}</dt><dd>${m.w}×${m.d}×${m.z}</dd>`;$("#spec").innerHTML=s;
$("#mq").textContent=tx("qm");$("#mq").dataset.m=m.n;
if(m.w){const S=300/Math.max(m.w,m.z),w=m.w*S,h=m.z*S;$("#draw").innerHTML=`<svg viewBox="-30 -20 ${w+90} ${h+70}" width="100%" style="max-width:${w+90}px;max-height:380px" role="img" aria-label="${m.n}"><g transform="translate(0,0)">${drawM({w:m.w,z:m.z},S)}</g><g stroke="var(--ink)" stroke-width="1" fill="var(--ink)" font-size="13"><path d="M0 ${h+16}H${w}M0 ${h+10}v12M${w} ${h+10}v12M${w+16} 0V${h}M${w+10} 0h12M${w+10} ${h}h12" fill="none"/><text x="${w/2}" y="${h+36}" text-anchor="middle" stroke="none">${m.w}</text><text x="${w+22}" y="${h/2}" stroke="none">${m.z}</text></g></svg>`}else $("#draw").innerHTML=""}
function route(){const h=location.hash.slice(1)||"home",mm=h.match(/^m(\d+)$/);cur=mm?"model":h=="catalog"?"catalog":"home";
$("#v-home").classList.toggle("hide",cur!="home");$("#v-cat").classList.toggle("hide",cur!="catalog");$("#v-model").classList.toggle("hide",cur!="model");
if(cur=="model")model(+mm[1]);if(cur=="catalog"){chips();table()}if(h=="quote"){$("#quote").scrollIntoView();return}if(h!="ind")scrollTo(0,0)}
function i18n(){document.documentElement.lang=lang;$$("[data-i]").forEach(e=>e.textContent=tx(e.dataset.i));$$("[data-ph]").forEach(e=>e.placeholder=tx(e.dataset.ph));$("#lang").textContent=lang=="uk"?"EN":"UA";
$("#theme").textContent=document.documentElement.dataset.theme=="dark"?(lang=="uk"?"Світла":"Light"):tx("dark");
$("#fo").innerHTML=Object.values(L[lang].indt).map(([n])=>`<option>${n}</option>`).join("");inds();setRange();route()}
$("#lang").onclick=()=>{lang=lang=="uk"?"en":"uk";i18n()};
$("#theme").onclick=()=>{const d=document.documentElement;d.dataset.theme=d.dataset.theme=="dark"?"light":"dark";i18n()};
["r1","r2"].forEach(id=>$("#"+id).oninput=e=>{st[id=="r1"?"lo":"hi"]=+e.target.value;setRange()});
$("#types").onclick=e=>{const b=e.target.closest("[data-t]");if(b){st.t=+b.dataset.t;st.lim=60;chips();table()}};
$("#heat").onchange=e=>{st.h=+e.target.value;table()};$("#q").oninput=e=>{st.q=e.target.value;st.lim=60;table()};
$("#more").onclick=()=>{st.lim+=60;table()};$("#reset").onclick=()=>{st.t=-1;st.h=-1;st.q="";$("#q").value="";st.lo=0;st.hi=1000;$("#r1").value=0;$("#r2").value=1000;setRange();chips()};
$("#thead").onclick=e=>{const b=e.target.closest("[data-k]");if(b){st.sd=st.sk==b.dataset.k?-st.sd:1;st.sk=b.dataset.k;table()}};
$("#mq").onclick=e=>{$("#fm").value=e.currentTarget.dataset.m};
$("#form").onsubmit=e=>{e.preventDefault();let ok=true;[["fn"],["fp"]].forEach(([id])=>{const b=!$("#"+id).value.trim();$("#"+id).parentElement.classList.toggle("bad",b);$("#"+id).setAttribute("aria-invalid",b);if(b){ok=false}});
if(!ok)return $("#form .bad input").focus();$("#form").classList.add("hide");const o=$("#ok");o.textContent=tx("okm");o.classList.remove("hide");o.focus()};
addEventListener("hashchange",route);
buildLine();i18n();if(location.hash.length<2)tween();else{st.lo=330;st.hi=650;$("#r1").value=330;$("#r2").value=650;setRange()}
</script>
</body>
</html>
